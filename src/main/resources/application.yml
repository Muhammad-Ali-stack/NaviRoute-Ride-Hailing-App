# ============================================================
# NaviRoute — Common Configuration
# Profile-specific settings in application-dev.yml / application-prod.yml
# ============================================================

spring:
  application:
    name: naviroute

  profiles:
    active: dev

  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

server:
  port: 8080

# Optional administrator bootstrap (see .env.example). No default password exists:
# if both are unset, no admin account is created or changed at startup.
naviroute:
  admin:
    email: ${NAVIROUTE_ADMIN_EMAIL:}
    password: ${NAVIROUTE_ADMIN_PASSWORD:}
  # Optional HTTP Basic user that may read /actuator/prometheus (and nothing else).
  # No default: if both are unset, only ADMIN tokens can read metrics.
  metrics:
    username: ${NAVIROUTE_METRICS_USERNAME:}
    password: ${NAVIROUTE_METRICS_PASSWORD:}

# Actuator endpoints for Prometheus monitoring
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  # Access rules are in SecurityConfig: /actuator/health (+ /liveness, /readiness) is public,
  # /actuator/prometheus needs the metrics scrape user or ADMIN, everything else needs ADMIN.
  endpoint:
    health:
      # Component details (database, Redis, disk) only for authenticated admins
      show-details: when-authorized
      roles: ADMIN
      probes:
        enabled: true
