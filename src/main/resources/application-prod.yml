# ============================================================
# PROD PROFILE — AWS deployment (RDS + ElastiCache + MSK)
# All values come from environment variables — never hardcoded
# ============================================================

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}

# JWT — JWT_SECRET is REQUIRED (random, at least 32 bytes). The application refuses to
# start if it is missing, too short, or a value published in this repository.
jwt:
  secret: ${JWT_SECRET:}
  allow-ephemeral-secret: false
  access-token-expiry: ${JWT_ACCESS_TOKEN_EXPIRY:900000}
  refresh-token-expiry: ${JWT_REFRESH_TOKEN_EXPIRY:604800000}

logging:
  level:
    com.ridesharing: INFO
    org.springframework.web: WARN
